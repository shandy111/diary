<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>拾光 · 情绪日记</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --bg: #F2F0EA;
    --bg-panel: #FFFFFF;
    --ink: #2B2A33;
    --ink-soft: #6B6976;
    --line: #E4E1D8;
    --indigo: #4A4470;
    --indigo-soft: #EFEDF7;
    --sage: #6F8F73;
    --sage-soft: #E7EFE6;
    --coral: #D97B5F;
    --coral-soft: #FBE8E0;
    --shadow: 0 1px 2px rgba(43,42,51,0.06), 0 8px 24px rgba(43,42,51,0.06);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1C1B22; --bg-panel:#26242E; --ink:#EDEBF2; --ink-soft:#A8A5B5;
      --line:#37354200; --indigo:#B8AEE0; --indigo-soft:#312D45;
      --sage:#9FC2A3; --sage-soft:#243027; --coral:#E79A80; --coral-soft:#3A2A25;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1C1B22; --bg-panel:#26242E; --ink:#EDEBF2; --ink-soft:#A8A5B5;
    --line:#3A3844; --indigo:#B8AEE0; --indigo-soft:#312D45;
    --sage:#9FC2A3; --sage-soft:#243027; --coral:#E79A80; --coral-soft:#3A2A25;
  }
  html{scroll-padding-top: env(safe-area-inset-top, 0px); background:var(--bg);}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Inter',-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100%;
  }
  .wrap{max-width:640px; margin:0 auto; padding:28px 20px 80px;}
  header.top{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:22px;}
  header.top h1{
    font-family:'Fraunces',serif; font-weight:500; font-size:26px; margin:0;
    letter-spacing:-0.01em;
  }
  header.top .date{color:var(--ink-soft); font-size:13px;}
  nav.tabs{
    display:flex; gap:4px; background:var(--bg-panel); border:1px solid var(--line);
    border-radius:12px; padding:4px; margin-bottom:22px; box-shadow:var(--shadow);
  }
  nav.tabs button{
    flex:1; border:none; background:transparent; padding:10px 6px; border-radius:9px;
    font-family:'Inter'; font-size:14px; font-weight:600; color:var(--ink-soft); cursor:pointer;
    transition:background .18s ease, color .18s ease;
  }
  nav.tabs button.active{background:var(--indigo); color:#fff;}
  section.view{display:none;}
  section.view.active{display:block; animation:fade .25s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
  .card{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:16px;
    padding:20px; margin-bottom:16px; box-shadow:var(--shadow);
  }
  .card h2{font-family:'Fraunces',serif; font-weight:500; font-size:18px; margin:0 0 4px;}
  .card .sub{color:var(--ink-soft); font-size:13px; margin:0 0 16px;}
  .moods{display:grid; grid-template-columns:repeat(5,1fr); gap:8px;}
  .mood-btn{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:12px 4px; border-radius:12px; border:1.5px solid var(--line);
    background:transparent; cursor:pointer; font-family:'Inter';
    transition:border-color .15s ease, background .15s ease;
  }
  .mood-btn .emoji{font-size:24px;}
  .mood-btn .label{font-size:11.5px; color:var(--ink-soft);}
  .mood-btn.selected{border-color:var(--indigo); background:var(--indigo-soft);}
  .mood-btn.selected .label{color:var(--indigo); font-weight:600;}
  .row-label{font-size:13px; font-weight:600; margin:18px 0 8px; color:var(--ink);}
  input[type=range]{width:100%; accent-color:var(--indigo);}
  .intensity-labels{display:flex; justify-content:space-between; font-size:11px; color:var(--ink-soft); margin-top:2px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    padding:7px 14px; border-radius:999px; border:1.5px solid var(--line); background:transparent;
    font-size:13px; color:var(--ink-soft); cursor:pointer; font-family:'Inter';
    transition:all .15s ease;
  }
  .chip.selected{border-color:var(--coral); background:var(--coral-soft); color:var(--coral); font-weight:600;}
  textarea{
    width:100%; border:1.5px solid var(--line); border-radius:12px; padding:12px 14px;
    font-family:'Inter'; font-size:14px; color:var(--ink); background:var(--bg); resize:vertical;
    min-height:64px;
  }
  textarea:focus, .mood-btn:focus-visible, .chip:focus-visible, button:focus-visible{
    outline:2px solid var(--indigo); outline-offset:2px;
  }
  .btn-primary{
    width:100%; margin-top:18px; padding:13px; border:none; border-radius:12px;
    background:var(--indigo); color:#fff; font-family:'Inter'; font-weight:600; font-size:14.5px;
    cursor:pointer; transition:opacity .15s ease;
  }
  .btn-primary:disabled{opacity:.4; cursor:not-allowed;}
  .btn-primary:not(:disabled):active{opacity:.85;}
  .empty{text-align:center; padding:36px 12px; color:var(--ink-soft);}
  .empty .big{font-size:32px; display:block; margin-bottom:10px;}
  .entry{
    display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--line);
  }
  .entry:last-child{border-bottom:none;}
  .entry .emoji{font-size:20px;}
  .entry .meta{font-size:12px; color:var(--ink-soft); margin-bottom:3px;}
  .entry .tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:4px;}
  .entry .tags span{
    font-size:11px; background:var(--sage-soft); color:var(--sage); padding:2px 8px; border-radius:999px;
  }
  .entry .note{font-size:13.5px; margin-top:4px; color:var(--ink);}
  .insight-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .insight-row .bar-bg{flex:1; height:8px; background:var(--indigo-soft); border-radius:99px; overflow:hidden;}
  .insight-row .bar-fill{height:100%; background:var(--indigo); border-radius:99px;}
  .insight-row .label{font-size:13px; width:78px; flex-shrink:0;}
  .insight-row .count{font-size:12px; color:var(--ink-soft); width:34px; text-align:right;}
  .reco-card{
    display:flex; gap:14px; padding:16px; border-radius:14px; border:1px solid var(--line);
    margin-bottom:12px; align-items:flex-start;
  }
  .reco-card .icon{font-size:26px; line-height:1;}
  .reco-card h3{font-size:15px; margin:0 0 3px; font-family:'Fraunces',serif; font-weight:500;}
  .reco-card p{font-size:13px; color:var(--ink-soft); margin:0 0 10px; line-height:1.5;}
  .reco-card button{
    border:1.5px solid var(--indigo); background:transparent; color:var(--indigo);
    font-size:12.5px; font-weight:600; padding:6px 12px; border-radius:999px; cursor:pointer; font-family:'Inter';
  }
  .breathe-overlay{
    position:fixed; inset:0; background:rgba(28,27,34,0.55); display:none; align-items:center; justify-content:center;
    z-index:50; padding:20px;
  }
  .breathe-overlay.active{display:flex;}
  .breathe-box{
    background:var(--bg-panel); border-radius:20px; padding:32px 24px; text-align:center; width:100%; max-width:320px;
  }
  .breathe-circle{
    width:140px; height:140px; border-radius:50%; margin:20px auto; background:var(--indigo-soft);
    border:2px solid var(--indigo); display:flex; align-items:center; justify-content:center;
    font-size:15px; font-weight:600; color:var(--indigo); transition:transform 4s ease;
  }
  .breathe-circle.in{transform:scale(1.35);}
  .breathe-circle.out{transform:scale(1);}
  .close-x{
    background:none; border:none; color:var(--ink-soft); font-size:13px; cursor:pointer; margin-top:6px;
  }
  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:99px;
    font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s ease; z-index:60;
  }
  .toast.show{opacity:1;}
  canvas{max-width:100%;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>拾光</h1>
    <span class="date" id="todayDate"></span>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="log">记录</button>
    <button class="tab-btn" data-tab="review">回顾</button>
    <button class="tab-btn" data-tab="care">自我关怀</button>
  </nav>

  <!-- 记录 -->
  <section class="view active" id="view-log">
    <div class="card">
      <h2>此刻的心情</h2>
      <p class="sub">选一个最接近的感受，不用很精确</p>
      <div class="moods" id="moodGrid"></div>

      <div class="row-label">强度</div>
      <input type="range" min="1" max="5" value="3" id="intensity">
      <div class="intensity-labels"><span>轻微</span><span>强烈</span></div>

      <div class="row-label">可能的触发因素（可多选）</div>
      <div class="chips" id="triggerChips"></div>

      <div class="row-label">想多说两句吗？</div>
      <textarea id="noteInput" placeholder="发生了什么，或者只是随便写写…"></textarea>

      <button class="btn-primary" id="saveBtn" disabled>记录这一刻</button>
    </div>
  </section>

  <!-- 回顾 -->
  <section class="view" id="view-review">
    <div class="card">
      <h2>情绪趋势</h2>
      <p class="sub">最近的记录，越高代表状态越好</p>
      <canvas id="trendChart" height="140"></canvas>
    </div>
    <div class="card">
      <h2>触发因素分析</h2>
      <p class="sub">低落时刻最常伴随的因素</p>
      <div id="insightList"></div>
    </div>
    <div class="card">
      <h2>记录时间线</h2>
      <div id="entryList"></div>
    </div>
  </section>

  <!-- 自我关怀 -->
  <section class="view" id="view-care">
    <div class="card">
      <h2>为你推荐</h2>
      <p class="sub">根据你最近的情绪状态自动匹配</p>
      <div id="recoList"></div>
    </div>
  </section>
</div>

<div class="breathe-overlay" id="breatheOverlay">
  <div class="breathe-box">
    <h3 style="font-family:'Fraunces',serif; font-weight:500; margin:0;">跟随呼吸</h3>
    <div class="breathe-circle" id="breatheCircle">吸气</div>
    <p style="color:var(--ink-soft); font-size:13px; margin:0;" id="breatheCount">4 轮，约 1 分钟</p>
    <button class="close-x" id="closeBreathe">结束</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
try{
(function(){
  const MOODS = [
    {v:1, emoji:'😞', label:'低落'},
    {v:2, emoji:'😕', label:'烦躁'},
    {v:3, emoji:'😐', label:'平淡'},
    {v:4, emoji:'🙂', label:'还不错'},
    {v:5, emoji:'😄', label:'愉快'},
  ];
  const TRIGGERS = ['学业','职场','人际关系','家庭','健康','经济','无特别原因'];

  const RECOS = [
    {type:'breathe', icon:'🌬️', title:'4-7-8 呼吸练习', desc:'吸气4秒、屏息7秒、呼气8秒，快速平复紧张感。', moods:[1,2], action:'breathe'},
    {type:'music', icon:'🎵', title:'低频環境音乐', desc:'试试 Lo-fi 或 Ambient 类音乐，帮助大脑从紧绷切换到放松。', moods:[1,2], action:null},
    {type:'exercise', icon:'🚶', title:'10分钟散步', desc:'离开当前环境，哪怕只是绕楼下走一圈，能有效打断反刍思维。', moods:[1,2,3], action:null},
    {type:'exercise', icon:'🧘', title:'肩颈拉伸', desc:'久坐后的酸痛常常放大烦躁感，花2分钟做几组拉伸。', moods:[2,3], triggers:['学业','职场'], action:null},
    {type:'journal', icon:'📝', title:'写下三件小事', desc:'记录今天让你觉得还行的三件小事，哪怕很微小。', moods:[3,4], action:null},
    {type:'music', icon:'🎧', title:'活力歌单', desc:'状态不错时，用节奏感强一点的音乐延续这份能量。', moods:[4,5], action:null},
    {type:'social', icon:'💬', title:'找人聊聊', desc:'如果人际关系是主要触发因素，一次坦诚的对话往往比独自消化更有效。', moods:[1,2], triggers:['人际关系','家庭'], action:null},
    {type:'rest', icon:'🌙', title:'提前休息', desc:'健康或经济压力容易让人失眠，今晚试着比平时早15分钟躺下。', moods:[1,2,3], triggers:['健康','经济'], action:null},
  ];

  const STORAGE_KEY = 'moodDiaryEntries_v1';
  let entries = [];
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    entries = raw ? JSON.parse(raw) : [];
  }catch(e){ entries = []; }

  let selectedMood = null;
  let selectedTriggers = new Set();

  // ---- date ----
  document.getElementById('todayDate').textContent = new Date().toLocaleDateString('zh-CN', {month:'long', day:'numeric', weekday:'short'});

  // ---- tabs ----
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('view-'+btn.dataset.tab).classList.add('active');
      if(btn.dataset.tab==='review') renderReview();
      if(btn.dataset.tab==='care') renderCare();
    });
  });

  // ---- mood grid ----
  const moodGrid = document.getElementById('moodGrid');
  MOODS.forEach(m=>{
    const b = document.createElement('button');
    b.className='mood-btn'; b.type='button';
    b.innerHTML = `<span class="emoji">${m.emoji}</span><span class="label">${m.label}</span>`;
    b.addEventListener('click', ()=>{
      selectedMood = m;
      document.querySelectorAll('.mood-btn').forEach(x=>x.classList.remove('selected'));
      b.classList.add('selected');
      document.getElementById('saveBtn').disabled = false;
    });
    moodGrid.appendChild(b);
  });

  // ---- trigger chips ----
  const chipWrap = document.getElementById('triggerChips');
  TRIGGERS.forEach(t=>{
    const c = document.createElement('button');
    c.className='chip'; c.type='button'; c.textContent=t;
    c.addEventListener('click', ()=>{
      if(selectedTriggers.has(t)){ selectedTriggers.delete(t); c.classList.remove('selected'); }
      else{ selectedTriggers.add(t); c.classList.add('selected'); }
    });
    chipWrap.appendChild(c);
  });

  // ---- save ----
  document.getElementById('saveBtn').addEventListener('click', ()=>{
    if(!selectedMood) return;
    const entry = {
      id: Date.now(),
      ts: new Date().toISOString(),
      mood: selectedMood,
      intensity: parseInt(document.getElementById('intensity').value,10),
      triggers: Array.from(selectedTriggers),
      note: document.getElementById('noteInput').value.trim(),
    };
    entries.unshift(entry);
    persist();
    // reset form
    selectedMood = null; selectedTriggers = new Set();
    document.querySelectorAll('.mood-btn').forEach(x=>x.classList.remove('selected'));
    document.querySelectorAll('.chip').forEach(x=>x.classList.remove('selected'));
    document.getElementById('noteInput').value='';
    document.getElementById('intensity').value=3;
    document.getElementById('saveBtn').disabled = true;
    showToast('已记录 ✓ 去「回顾」看看趋势吧');
  });

  function persist(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); }catch(e){}
  }

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2200);
  }

  // ---- review ----
  let chartInstance = null;
  function renderReview(){
    const list = document.getElementById('entryList');
    if(entries.length===0){
      list.innerHTML = `<div class="empty"><span class="big">🌱</span>还没有记录<br>去「记录」写下第一条吧</div>`;
    } else {
      list.innerHTML = entries.slice(0,20).map(e=>{
        const d = new Date(e.ts);
        const time = d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
        const tags = e.triggers.map(t=>`<span>${t}</span>`).join('');
        return `<div class="entry">
          <div class="emoji">${e.mood.emoji}</div>
          <div style="flex:1">
            <div class="meta">${time} · ${e.mood.label} · 强度 ${e.intensity}</div>
            ${tags?`<div class="tags">${tags}</div>`:''}
            ${e.note?`<div class="note">${escapeHtml(e.note)}</div>`:''}
          </div>
        </div>`;
      }).join('');
    }

    // chart
    const ctx = document.getElementById('trendChart');
    const recent = entries.slice(0,14).reverse();
    const labels = recent.map(e=> new Date(e.ts).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'}));
    const data = recent.map(e=> e.mood.v);
    if(chartInstance) chartInstance.destroy();
    if(recent.length>0){
      chartInstance = new Chart(ctx, {
        type:'line',
        data:{ labels, datasets:[{
          data, borderColor:'#4A4470', backgroundColor:'rgba(74,68,112,0.12)',
          fill:true, tension:0.35, pointRadius:3, pointBackgroundColor:'#4A4470'
        }]},
        options:{
          plugins:{legend:{display:false}},
          scales:{
            y:{min:0.5,max:5.5, ticks:{stepSize:1, callback:v=> (MOODS.find(m=>m.v===v)||{}).emoji || ''}},
            x:{grid:{display:false}}
          }
        }
      });
    }

    // trigger insight — count low-mood (v<=2) entries per trigger
    const counts = {};
    entries.forEach(e=>{
      if(e.mood.v<=2){
        e.triggers.forEach(t=> counts[t]=(counts[t]||0)+1);
      }
    });
    const insightEl = document.getElementById('insightList');
    const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
    if(sorted.length===0){
      insightEl.innerHTML = `<p class="sub" style="margin:0">暂时还看不出明显规律，多记录几次会更准确。</p>`;
    } else {
      const max = sorted[0][1];
      insightEl.innerHTML = sorted.map(([t,c])=>`
        <div class="insight-row">
          <div class="label">${t}</div>
          <div class="bar-bg"><div class="bar-fill" style="width:${(c/max*100).toFixed(0)}%"></div></div>
          <div class="count">${c}次</div>
        </div>`).join('');
    }
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---- self-care recommendations ----
  function renderCare(){
    const el = document.getElementById('recoList');
    const recent = entries.slice(0,5);
    let moodLevel = recent.length ? Math.round(recent.reduce((s,e)=>s+e.mood.v,0)/recent.length) : 3;
    const recentTriggers = new Set();
    recent.forEach(e=> e.triggers.forEach(t=>recentTriggers.add(t)));

    let matches = RECOS.filter(r=> r.moods.includes(moodLevel));
    // prefer ones matching a recent trigger
    matches.sort((a,b)=>{
      const aMatch = a.triggers && a.triggers.some(t=>recentTriggers.has(t)) ? 1:0;
      const bMatch = b.triggers && b.triggers.some(t=>recentTriggers.has(t)) ? 1:0;
      return bMatch-aMatch;
    });
    if(matches.length===0) matches = RECOS.slice(0,3);

    el.innerHTML='';
    matches.slice(0,4).forEach(r=>{
      const div = document.createElement('div');
      div.className='reco-card';
      div.innerHTML = `<div class="icon">${r.icon}</div>
        <div style="flex:1">
          <h3>${r.title}</h3>
          <p>${r.desc}</p>
          ${r.action==='breathe' ? '<button class="startBreathe">开始练习</button>' : ''}
        </div>`;
      el.appendChild(div);
    });
    const bbtn = el.querySelector('.startBreathe');
    if(bbtn) bbtn.addEventListener('click', startBreathing);
  }

  // ---- breathing exercise ----
  let breatheTimer = null;
  function startBreathing(){
    const overlay = document.getElementById('breatheOverlay');
    const circle = document.getElementById('breatheCircle');
    const countEl = document.getElementById('breatheCount');
    overlay.classList.add('active');
    let round = 0;
    const phases = [
      {name:'吸气', cls:'in', dur:4000},
      {name:'屏息', cls:'in', dur:7000},
      {name:'呼气', cls:'out', dur:8000},
    ];
    let pIdx = 0;
    function step(){
      if(round>=4){ stopBreathing(); return; }
      const p = phases[pIdx];
      circle.textContent = p.name;
      circle.className = 'breathe-circle ' + p.cls;
      countEl.textContent = `第 ${round+1}/4 轮`;
      breatheTimer = setTimeout(()=>{
        pIdx++;
        if(pIdx>=phases.length){ pIdx=0; round++; }
        step();
      }, p.dur);
    }
    step();
  }
  function stopBreathing(){
    clearTimeout(breatheTimer);
    document.getElementById('breatheOverlay').classList.remove('active');
  }
  document.getElementById('closeBreathe').addEventListener('click', stopBreathing);

  renderReview();
})();
}catch(e){ console.error(e); }
</script>
</body>
